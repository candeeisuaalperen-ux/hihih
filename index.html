
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nesrin ❤️</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  overflow: hidden;
  background: linear-gradient(135deg, #ffe0eb, #ffb6cc);
  font-family: Arial, sans-serif;
  text-align: center;
  color: #8b1747;
}

.card {
  background: white;
  width: 88%;
  max-width: 420px;
  padding: 35px 22px;
  border-radius: 25px;
  box-shadow: 0 10px 35px #d8799b55;
  position: relative;
  z-index: 2;
}

h1 { font-size: 34px; }

p {
  font-size: 21px;
  line-height: 1.5;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 23px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#yes {
  background: #ed397b;
  color: white;
}

#no {
  background: #ffe1eb;
  color: #9d315b;
}

#result {
  font-size: 25px;
  font-weight: bold;
  margin-top: 20px;
  line-height: 1.5;
}

.flying {
  position: fixed;
  bottom: -50px;
  font-size: 28px;
  font-weight: bold;
  animation: fly 4s linear forwards;
  pointer-events: none;
  z-index: 1;
}

@keyframes fly {
  0% {
    transform: translateY(0) rotate(0deg);
    opacity: 1;
  }
  100% {
    transform: translateY(-115vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <div id="top" style="font-size:48px">💗</div>

  <h1 id="heading">Nesrin ❤️</h1>

  <p id="question">
    Sana bir sorum var...<br>
    <strong>Benimle çıkar mısın?</strong>
  </p>

  <div id="buttons">
    <button id="yes">EVET ❤️</button>
    <button id="no">HAYIR 🥺</button>
  </div>

  <div id="result"></div>
</div>

<script>
let step = 0;
let scale = 1;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const result = document.getElementById("result");

yes.onclick = function() {
  step++;

  if (step === 1) {
    document.getElementById("question").innerHTML =
      "Bak cidden emin misin? 🥺";

    yes.textContent = "EVET ❤️";
  }

  else if (step === 2) {
    document.getElementById("question").innerHTML =
      "Oha cidden seviyorsun lan! ❤️";

    yes.textContent = "EVETTT ❤️";
  }

  else if (step === 3) {
    document.getElementById("question").innerHTML =
      "Kabul ediyorsun yani bu naçizane teklifimi ha canım? 🥹❤️";

    yes.textContent = "EVET, KABUL EDİYORUM ❤️";
  }

  else if (step === 4) {
    document.getElementById("top").textContent = "";
    document.getElementById("heading").textContent = "";
    document.getElementById("question").textContent = "";
    document.getElementById("buttons").style.display = "none";

    result.textContent = "Yuppiii seviyorum seniiii ❤️❤️❤️";

    const symbols = ["❤️", "🤍", "💗", "💕", "A", "N"];

    for (let i = 0; i < 100; i++) {
      setTimeout(() => {
        const item = document.createElement("div");

        item.className = "flying";
        item.textContent = symbols[
          Math.floor(Math.random() * symbols.length)
        ];

        item.style.left = Math.random() * 100 + "vw";
        item.style.animationDuration = (3 + Math.random() * 3) + "s";

        document.body.appendChild(item);

        setTimeout(() => item.remove(), 6000);
      }, i * 70);
    }

    setInterval(() => {
      const item = document.createElement("div");

      item.className = "flying";
      item.textContent = symbols[
        Math.floor(Math.random() * symbols.length)
      ];

      item.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(item);

      setTimeout(() => item.remove(), 5000);
    }, 250);
  }
};

no.onclick = function() {
  scale = Math.max(0.1, scale * 0.7);
  no.style.transform = "scale(" + scale + ")";

  if (scale < 0.3) {
    no.textContent = "🥺";
  }
};
</script>

</body>
</html>
