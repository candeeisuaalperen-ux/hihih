
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>❤️ Nesrin</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  background: linear-gradient(135deg, #ffe0eb, #ffb6cc);
  font-family: Arial, sans-serif;
  text-align: center;
  color: #8b1747;
}

.card {
  background: white;
  width: 88%;
  max-width: 420px;
  padding: 35px 22px;
  border-radius: 25px;
  box-shadow: 0 10px 35px #d8799b55;
}

h1 {
  font-size: 34px;
}

p {
  font-size: 21px;
  line-height: 1.5;
}

button {
  border: none;
  border-radius: 30px;
  padding: 14px 23px;
  margin: 8px;
  font-size: 17px;
  font-weight: bold;
  cursor: pointer;
}

#yes {
  background: #ed397b;
  color: white;
}

#no {
  background: #ffe1eb;
  color: #9d315b;
}

#result {
  font-size: 23px;
  font-weight: bold;
  margin-top: 20px;
}

.heart {
  position: fixed;
  bottom: -40px;
  font-size: 28px;
  animation: fly 3s linear forwards;
  pointer-events: none;
}

@keyframes fly {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <div id="top" style="font-size:48px">💗</div>

  <h1 id="heading">Nesrin ❤️</h1>

  <p id="question">
    Sana bir sorum var...<br>
    <strong>Benimle çıkar mısın?</strong>
  </p>

  <div id="buttons">
    <button id="yes">EVET ❤️</button>
    <button id="no">HAYIR 🥺</button>
  </div>

  <div id="result"></div>
</div>

<script>
let step = 0;
let scale = 1;

const yes = document.getElementById("yes");
const no = document.getElementById("no");
const result = document.getElementById("result");

yes.onclick = function() {
  step++;

  if (step === 1) {
    document.getElementById("question").innerHTML =
      "Bak cidden emin misin? 🥺";

    yes.textContent = "EVET ❤️";
  }

  else if (step === 2) {
    document.getElementById("question").innerHTML =
      "Oha cidden seviyorsun ha! 🥹❤️";

    yes.textContent = "EVETTT ❤️";
  }

  else if (step === 3) {
    document.getElementById("top").textContent = "";
    document.getElementById("heading").textContent = "";
    document.getElementById("question").textContent = "";
    document.getElementById("buttons").style.display = "none";

    result.textContent = "Yuppiii seviyorum seni Lann ❤️❤️";

    for (let i = 0; i < 50; i++) {
      setTimeout(() => {
        let heart = document.createElement("div");
        heart.className = "heart";
        heart.textContent = ["❤️","🤍","💗","💕"][Math.floor(Math.random()*4)];
        heart.style.left = Math.random() * 100 + "vw";
        document.body.appendChild(heart);

        setTimeout(() => heart.remove(), 3000);
      }, i * 80);
    }
  }
};

no.onclick = function() {
  scale = Math.max(0.1, scale * 0.7);
  no.style.transform = "scale(" + scale + ")";
  if (scale < 0.3) {
    no.textContent = "🥺";
  }
};
</script>

</body>
</html>
